<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çılgın Yılan Oyunu</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #00ffcc;
        }
        #score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #333;
            background-color: #1e1e1e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>ÇILGIN YILAN OYUNU</h1>
    <div id="score-board">Skor: <span id="score">0</span> | Yemek Sayısı: <span id="food-count">0</span>/5</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">Yön tuşları ile kontrol et. Duvarlardan geçebilirsin!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        
        const foodTypes = [
            { emoji: "🍗", name: "Tavuk Butu" },
            { emoji: "🍔", name: "Hamburger" },
            { emoji: "🍕", name: "Pizza" },
            { emoji: "🌭", name: "Sosisli" },
            { emoji: "🍟", name: "Patates Kızartması" }
        ];
        
        let currentFood = { x: 5, y: 5, type: foodTypes[0] };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let eatenFoodCount = 0;
        let gameInterval;
        let changingDirection = false;
        let isPaused = false;
        let gameSpeed = 100;

        // Görsel Yükleme Mekaniği
        const snakeHeadImg = new Image();
        let imageLoaded = false;
        
        snakeHeadImg.src = 'head.png'; 

        snakeHeadImg.onload = () => {
            imageLoaded = true;
            console.log("Yılan başı görseli başarıyla yüklendi.");
        };

        snakeHeadImg.onerror = () => {
            imageLoaded = false;
            console.error("Görsel yüklenemedi. Lütfen 'head.png' dosyasının deponun ana dizininde olduğundan emin olun.");
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playEatSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playToiletSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        document.addEventListener("keydown", changeDirection);

        function main() {
            if (isPaused) return;

            if (hasGameEnded()) {
                alert("Kuyruğuna çarptın! Oyun Bitti! Skorun: " + score);
                resetGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        startGame();

        function startGame() {
            gameInterval = setInterval(main, gameSpeed);
            generateFood();
        }

        function clearCanvas() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                let sizeFactor = Math.min(gridSize - 2 + (eatenFoodCount * 0.5), gridSize + 4);
                let offset = (gridSize - sizeFactor) / 2;

                if (index === 0) {
                    if (imageLoaded) {
                        ctx.drawImage(snakeHeadImg, part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                    } else {
                        // Görsel yüklenene kadar veya yüklenemezse yedek kutu
                        ctx.fillStyle = "#00ffcc";
                        ctx.fillRect(part.x * gridSize + offset, part.y * gridSize + offset, sizeFactor, sizeFactor);
                    }
                } else {
                    ctx.fillStyle = "#00adb5";
                    ctx.fillRect(part.x * gridSize + offset, part.y * gridSize + offset, sizeFactor, sizeFactor);
                }
            });
        }

        function moveSnake() {
            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            if (headX < 0) headX = tileCount - 1;
            if (headX >= tileCount) headX = 0;
            if (headY < 0) headY = tileCount - 1;
            if (headY >= tileCount) headY = 0;

            const newHead = { x: headX, y: headY };
            snake.unshift(newHead);

            const hasEatenFood = snake[0].x === currentFood.x && snake[0].y === currentFood.y;
            if (hasEatenFood) {
                score += 10;
                eatenFoodCount++;
                document.getElementById("score").innerText = score;
                document.getElementById("food-count").innerText = eatenFoodCount % 5;
                
                playEatSound();

                if (eatenFoodCount === 5) {
                    triggerToiletBreak();
                } else {
                    generateFood();
                }
            } else {
                snake.pop();
            }
        }

        function triggerToiletBreak() {
            isPaused = true;
            playToiletSound();

            clearCanvas();
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff5722";
            ctx.font = "bold 24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🚽 TUVALET MOLASI! 🚽", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.fillStyle = "#e0e0e0";
            ctx.font = "16px sans-serif";
            ctx.fillText("Yılan klozete oturdu, hafifliyor...", canvas.width / 2, canvas.height / 2 + 20);

            setTimeout(() => {
                if (snake.length > 5) {
                    snake.splice(-3, 3);
                }
                eatenFoodCount = 0;
                document.getElementById("food-count").innerText = eatenFoodCount;
                generateFood();
                isPaused = false;
            }, 2000);
        }

        function generateFood() {
            currentFood.x = Math.floor(Math.random() * tileCount);
            currentFood.y = Math.floor(Math.random() * tileCount);
            const randomIndex = Math.floor(Math.random() * foodTypes.length);
            currentFood.type = foodTypes[randomIndex];

            snake.forEach(part => {
                if (part.x === currentFood.x && part.y === currentFood.y) generateFood();
            });
        }

        function drawFood() {
            ctx.font = `${gridSize}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(
                currentFood.type.emoji, 
                (currentFood.x * gridSize) + (gridSize / 2), 
                (currentFood.y * gridSize) + (gridSize / 2)
            );
        }

        function hasGameEnded() {
            let selfCollision = false;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) selfCollision = true;
            }
            return selfCollision;
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

            if (changingDirection) return;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
            if (keyPressed === UP && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
            if (keyPressed === RIGHT && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
            if (keyPressed === DOWN && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            score = 0;
            eatenFoodCount = 0;
            document.getElementById("score").innerText = score;
            document.getElementById("food-count").innerText = eatenFoodCount;
            dx = 1; dy = 0;
            generateFood();
        }
    </script>
</body>
</html>
